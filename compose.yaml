# Local database verification only; production template is deploy/compose.production.yaml.
services:
  database:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: whatsapp_test
      MYSQL_USER: whatsapp
      MYSQL_PASSWORD: local-test-password
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - database:/var/lib/mysql
volumes:
  database:
